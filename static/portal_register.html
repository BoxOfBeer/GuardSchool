<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GuardSchool — регистрация</title>
    <link rel="stylesheet" href="/static/styles.css?v=1.02.001" />
    <style>
      /* Перекрываем глобальные стили admin/TV (styles.css): школьный тёмно-синий + белый текст */
      html.portal-skin,
      body.portal-skin {
        min-height: 100%;
        margin: 0;
        color: #f4f7ff !important;
        background: radial-gradient(1200px 600px at 20% 0%, #1a3a6e 0%, #0b1f3d 45%, #071428 100%) !important;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
      }
      body.portal-skin a {
        color: #9ec5ff;
      }
      body.portal-skin a:hover {
        color: #cfe4ff;
      }
      body.portal-skin code {
        color: #e8f0ff;
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 6px;
        border-radius: 6px;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 18px 60px;
      }
      .card {
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        padding: 20px;
        background: rgba(10, 28, 52, 0.72);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
      }
      .row {
        display: grid;
        gap: 6px;
        margin-top: 10px;
      }
      label {
        font-weight: 600;
        color: #e8f0ff;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.96);
        color: #0b1f3d;
      }
      input::placeholder {
        color: #5a6b82;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      button,
      a.btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 12px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.1);
        color: #f4f7ff;
        text-decoration: none;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary {
        background: #f4f7ff;
        color: #0b1f3d;
        border-color: #f4f7ff;
      }
      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: rgba(244, 247, 255, 0.78);
      }
      .out {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px dashed rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.25);
        color: #f4f7ff;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body class="portal-skin">
    <div class="wrap">
      <div class="card">
        <h2 style="margin: 0 0 8px; color: #fff">Регистрация GuardSchool</h2>
        <div style="color: rgba(244, 247, 255, 0.9)">
          Лицензия — это ваш “логин”, пароль вы задаёте сами. После регистрации откроется ваша школа на
          <code>&lt;код_школы&gt;.guarddoc.ru</code>.
        </div>

        <div class="row">
          <label for="tenant">Код школы (tenant_slug)</label>
          <input id="tenant" placeholder="например: g50" autocomplete="off" />
        </div>
        <div class="row">
          <label for="key">Ключ лицензии (license_key)</label>
          <input id="key" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" />
        </div>
        <div class="row">
          <label for="pass">Пароль</label>
          <input id="pass" type="password" placeholder="придумайте пароль" autocomplete="new-password" />
        </div>

        <div class="actions">
          <button class="primary" id="go">Зарегистрироваться</button>
          <a class="btn" href="/">Назад на GuardDoc</a>
        </div>

        <div class="hint">
          Примечание: это MVP-страница. Покупка/оплата может быть добавлена позже, сейчас регистрация привязывает ключ к
          школе.
        </div>

        <div class="out" id="out" style="display: none"></div>
      </div>
    </div>

    <script type="module">
      const out = document.getElementById("out");
      const tenant = document.getElementById("tenant");
      const key = document.getElementById("key");
      const pass = document.getElementById("pass");
      const go = document.getElementById("go");

      function show(msg) {
        out.style.display = "block";
        out.textContent = msg;
      }

      go.addEventListener("click", async () => {
        const payload = {
          tenant_slug: String(tenant.value || "").trim().toLowerCase(),
          license_key: String(key.value || "").trim(),
          password: String(pass.value || ""),
        };
        if (!payload.tenant_slug || !payload.license_key || !payload.password) {
          show("Заполните: код школы, ключ лицензии и пароль.");
          return;
        }
        go.disabled = true;
        try {
          const r = await fetch("/api/saas/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            show(`Ошибка ${r.status}: ${data.detail || JSON.stringify(data)}`);
            return;
          }
          const host = `${payload.tenant_slug}.guarddoc.ru`;
          show(
            `Готово.\n\nОткройте: https://${host}/\n\n(если DNS/SSL уже настроены на *.guarddoc.ru)\n\nОтвет сервера: ${JSON.stringify(
              data,
              null,
              2
            )}`
          );
        } catch (e) {
          show(String(e));
        } finally {
          go.disabled = false;
        }
      });
    </script>
  </body>
</html>
