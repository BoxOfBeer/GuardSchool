<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GuardSchool — регистрация</title>
    <link rel="stylesheet" href="/static/styles.css?v=1.02.001" />
    <style>
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 18px 60px;
      }
      .card {
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 14px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.9);
      }
      .row {
        display: grid;
        gap: 6px;
        margin-top: 10px;
      }
      label {
        font-weight: 600;
        opacity: 0.9;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.18);
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      button,
      a.btn {
        appearance: none;
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 12px;
        padding: 10px 14px;
        background: #fff;
        color: #111;
        text-decoration: none;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      .hint {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.75;
      }
      .out {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px dashed rgba(0, 0, 0, 0.22);
        background: rgba(255, 255, 255, 0.7);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h2 style="margin: 0 0 8px">Регистрация GuardSchool</h2>
        <div style="opacity: 0.9">
          Лицензия — это ваш “логин”, пароль вы задаёте сами. После регистрации откроется ваша школа на
          <code>&lt;код_школы&gt;.guarddoc.ru</code>.
        </div>

        <div class="row">
          <label for="tenant">Код школы (tenant_slug)</label>
          <input id="tenant" placeholder="например: g50" autocomplete="off" />
        </div>
        <div class="row">
          <label for="key">Ключ лицензии (license_key)</label>
          <input id="key" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" />
        </div>
        <div class="row">
          <label for="pass">Пароль</label>
          <input id="pass" type="password" placeholder="придумайте пароль" autocomplete="new-password" />
        </div>

        <div class="actions">
          <button class="primary" id="go">Зарегистрироваться</button>
          <a class="btn" href="/">Назад на GuardDoc</a>
        </div>

        <div class="hint">
          Примечание: это MVP-страница. Покупка/оплата может быть добавлена позже, сейчас регистрация привязывает ключ к
          школе.
        </div>

        <div class="out" id="out" style="display: none"></div>
      </div>
    </div>

    <script type="module">
      const out = document.getElementById("out");
      const tenant = document.getElementById("tenant");
      const key = document.getElementById("key");
      const pass = document.getElementById("pass");
      const go = document.getElementById("go");

      function show(msg) {
        out.style.display = "block";
        out.textContent = msg;
      }

      go.addEventListener("click", async () => {
        const payload = {
          tenant_slug: String(tenant.value || "").trim().toLowerCase(),
          license_key: String(key.value || "").trim(),
          password: String(pass.value || ""),
        };
        if (!payload.tenant_slug || !payload.license_key || !payload.password) {
          show("Заполните: код школы, ключ лицензии и пароль.");
          return;
        }
        go.disabled = true;
        try {
          const r = await fetch("/api/saas/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            show(`Ошибка ${r.status}: ${data.detail || JSON.stringify(data)}`);
            return;
          }
          const host = `${payload.tenant_slug}.guarddoc.ru`;
          show(
            `Готово.\n\nОткройте: https://${host}/\n\n(если DNS/SSL уже настроены на *.guarddoc.ru)\n\nОтвет сервера: ${JSON.stringify(
              data,
              null,
              2
            )}`
          );
        } catch (e) {
          show(String(e));
        } finally {
          go.disabled = false;
        }
      });
    </script>
  </body>
</html>
