<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Первичная настройка | GuardSchool</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260401-1">
</head>
<body class="auth-body">
  <form class="auth-card" id="setup-form">
    <h1>Создание администратора</h1>
    <label>Логин
      <input name="username" type="text" required>
    </label>
    <label>Пароль
      <input name="password" type="password" required>
    </label>
    <p class="hint">Минимум 8 символов, буквы и цифры, без повторяющихся символов.</p>
    <button class="primary-btn" type="submit">Создать</button>
    <p id="setup-message" class="message"></p>
  </form>
  <script src="/static/setup.js?v=20260401-1"></script>
</body>
</html>
