<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GuardDoc — ADM</title>
    <link rel="stylesheet" href="/static/styles.css?v=1.02.001" />
    <link rel="stylesheet" href="/static/portal_skin.css?v=2" />
    <style>
      .wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 28px 18px 60px;
      }
      .row {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }
    </style>
  </head>
  <body class="portal-skin">
    <div class="wrap">
      <div class="portal-card">
        <h2 style="margin: 0 0 8px; color: #fff">ADM — лицензии</h2>
        <p class="portal-hint" style="margin-top: 0">
          Служебный вход (не показывать на витрине). Логин и пароль задаются на сервере:
          <code>GUARDSCHOOL_PORTAL_ADM_USERNAME</code>, <code>GUARDSCHOOL_PORTAL_ADM_PASSWORD</code>.
        </p>
        <div class="row">
          <label class="portal-label" for="user">Логин</label>
          <input id="user" class="portal-field" autocomplete="username" />
        </div>
        <div class="row">
          <label class="portal-label" for="pass">Пароль</label>
          <input id="pass" class="portal-field" type="password" autocomplete="current-password" />
        </div>
        <div class="row" style="margin-top: 16px">
          <button type="button" class="portal-btn primary" id="go">Войти</button>
          <a class="portal-btn" href="/">На портал</a>
        </div>
        <div class="portal-out" id="out" style="display: none; margin-top: 14px"></div>
      </div>
    </div>
    <script type="module">
      const out = document.getElementById("out");
      document.getElementById("go").addEventListener("click", async () => {
        const username = String(document.getElementById("user").value || "").trim();
        const password = String(document.getElementById("pass").value || "");
        out.style.display = "block";
        out.textContent = "";
        try {
          const r = await fetch("/api/portal-adm/login", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(data.detail || r.status);
          window.location.href = "/ADM";
        } catch (e) {
          out.textContent = String(e.message || e);
        }
      });
    </script>
  </body>
</html>
