<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardSchool Screen</title>
  <script>
    try {
      window.__GS_APP_VERSION = "__GS_ASSETS_VER__";
    } catch (_) {}
  </script>
  __GS_PWA_MANIFEST_LINK__
  <!-- Только анти-«белый экран» до styles.css. Виджеты и таблицу не трогаем — дубли с !important ломали
       реальные стили (и inline из JS), когда основной CSS всё-таки подгружался. -->
  <style>
    :root {
      --bg: #0f172a;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
    }
    html { background: var(--bg); }
    body.screen-body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      /* Явный hex: часть ТВ-браузеров даёт UA-серый, если color только через var(). */
      color: #f8fafc;
      font-family: system-ui, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }
    #screen-root.tv-screen {
      min-height: 100vh;
      box-sizing: border-box;
    }
    .gs-audio-hint {
      color: #e2e8f0;
      font-size: 15px;
    }
  </style>
  <!--
    Стили ТВ: по умолчанию /static/styles-tv.css (фрагмент styles.css между маркерами «styles-tv.css») — меньше парсеру ТВ.
    Сравнить с полным файлом: ?gs_full_css=1 в URL экрана.
    Пересборка (из корня репо, PowerShell):
      $b='static/styles.css'; $o='static/styles-tv.css'; $u=[System.Text.UTF8Encoding]::new($false)
      $a=[System.IO.File]::ReadAllLines($b,[System.Text.Encoding]::UTF8)
      [System.IO.File]::WriteAllLines($o,$a[0..24]+$a[2148..2762],$u)
  -->
  <link rel="stylesheet" id="tv-styles" media="all" />
  <script>
    (function () {
      try {
        // ТВ: отдельный CSS экрана (админка использует /static/styles.css).
        window.__GS_TV_CSS_BASE = "/static/styles-screen.css";
        var el = document.getElementById("tv-styles");
        if (!el) return;
        el.rel = "stylesheet";
        var ts = Date.now();
        el.href = window.__GS_TV_CSS_BASE + "?v=__GS_ASSETS_VER__&tvts=" + ts;
      } catch (_) {}
    })();
  </script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body class="screen-body">
  <div id="gs-audio-hint" class="gs-audio-hint" role="status">
    Коснитесь экрана или нажмите любую клавишу один раз — чтобы браузер разрешил звук звонков.
  </div>
  <div id="gs-crash-banner" class="gs-crash-banner" role="status" hidden></div>
  <div id="screen-root" class="tv-screen"></div>
  <script>
    (function () {
      try {
        var ts = Date.now();
        var s1 = document.createElement("script");
        s1.src = "/static/screen_widgets.js?v=__GS_ASSETS_VER__&tvts=" + ts;
        s1.defer = true;
        document.body.appendChild(s1);
        var s2 = document.createElement("script");
        s2.src = "/static/screen.js?v=__GS_ASSETS_VER__&tvts=" + ts;
        s2.defer = true;
        document.body.appendChild(s2);
      } catch (_) {}
    })();
  </script>
</body>
</html>
