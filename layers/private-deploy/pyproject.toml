[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guardschool-private"
version = "0.1.0"
description = "GuardSchool closed SaaS/commercial modules (not for public PyPI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["guardschool_private*"]
