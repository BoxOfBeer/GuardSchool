# Пример: портал guarddoc.ru + www + demo → прокси на uvicorn (GuardSchool).
# Сертификат Let's Encrypt после certbot expand (один SAN на все имена):
#   /etc/letsencrypt/live/school.guarddoc.ru/fullchain.pem
#
# Установка:
#   sudo cp nginx-portal-proxy.example.conf /etc/nginx/sites-available/guarddoc-portal.conf
#   # при необходимости отредактируйте порт upstream (8000) и пути к сертификату
#   sudo ln -sf /etc/nginx/sites-available/guarddoc-portal.conf /etc/nginx/sites-enabled/
#
# ВАЖНО: если certbot ранее прописал guarddoc.ru / www / demo в /etc/nginx/sites-available/default,
# nginx выдаст «conflicting server name … ignored» и ОТБРОСИТ этот файл — останется default с root
# и страница «Welcome to nginx». Удалите из default все server { … } с этими server_name
# (или закомментируйте блоки «managed by Certbot» для портала), оставив только guarddoc-portal.conf.
#   sudo nginx -t && sudo systemctl reload nginx
#
# Отдельный server { } для school.* — продублируйте client_max_body_size и proxy_*,
# иначе загрузки картинок в админке (/api/admin/school-news/*-upload) могут получать 413 от nginx.

upstream guardschool_app {
    server 127.0.0.1:8000;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name guarddoc.ru www.guarddoc.ru demo.guarddoc.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guarddoc.ru www.guarddoc.ru demo.guarddoc.ru;

    ssl_certificate     /etc/letsencrypt/live/school.guarddoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.guarddoc.ru/privkey.pem;
    # Обычно создаётся certbot; если nginx -t ругается — закомментируйте эти include.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://guardschool_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
