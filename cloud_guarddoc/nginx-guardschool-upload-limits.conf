# GuardSchool — лимит тела HTTP-запроса (multipart: картинки, Excel, звуки).
# По умолчанию у nginx client_max_body_size = 1m → ошибка 413 даже для файлов ~1–2 МиБ.
#
# === Подключение по SSH (пример) ===
# 1) Скопировать этот файл на сервер (с локальной машины, из корня репозитория):
#    scp cloud_guarddoc/nginx-guardschool-upload-limits.conf root@195.208.2.62:/etc/nginx/snippets/guardschool-upload-limits.conf
# 2) На сервере в блоке server { } для школьного домена (например school.guarddoc.ru) добавить ВНУТРИ server, до или внутри location /:
#        include snippets/guardschool-upload-limits.conf;
#    Либо вставить содержимое ниже одной строкой в server { }.
# 3) Проверка и перезагрузка:
#    sudo nginx -t && sudo systemctl reload nginx
#
# Если отдельный server только для school.* — include обязателен и там (не только в блоке портала).

client_max_body_size 32m;
