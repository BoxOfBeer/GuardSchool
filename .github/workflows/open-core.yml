name: open-core

on:
  push:
    branches: [main, master, saas-hybrid]
  pull_request:
    branches: [main, master, saas-hybrid]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check JS
        run: |
          node --check static/tv-core-utils.js
          node --check static/tv-schedule-table.js
          node --check static/tv-screen-shell.js
          node --check static/screen_widgets.js
          for f in static/widgets/*.js; do node --check "$f"; done
      - name: Unit tests (full tree)
        run: python -m unittest discover -s tests -q
      - name: Locale parity
        run: |
          python tools/check_locales.py
          python tools/check_locales.py --check-tv --warn-terms
      - name: Widget parity (Python / JS / manifest)
        run: python tools/check_widget_parity.py
      - name: Verify open-core bundle
        run: python tools/verify_open_core.py
      - name: Docker build
        run: docker compose build
